<!DOCTYPE html>

    <body id="pageBegin">
        <header id="header">
            <h1 id="titleName">おみくじ</h1>
        </header>
        <div id="colorBand" style="min-height:0.5rem;background: #f0f0f0;"></div>
        <!--NAME ENTRY-->
        <div id="nameEntry" class="mainContents">
            <h3>ニックネーム</h3>
            <input id="nickNameEntry" style="width:20rem;height:3rem;border-width:1px;border-radius:1rem;" type="text">
            <h3>性別</h3>
            <select id="genderEntry" style="width:20rem;height:3rem;border-width:1px;border-radius:1rem;">
                <option value="notChosen" disabled selected>--1つ選択してください--</option>
                <option value="women">女性</option>
                <option value="men">男性</option>
                <option value="others">その他</option>
            </select>
            <h3>今の恋愛状況</h3>
            <select id="loveStatusEntry" style="width:20rem;height:3rem;border-width:1px;border-radius:1rem;">
                <option value="0" disabled selected>--1つ選択してください--</option>
                <option value="1">恋人あり</option>
                <option value="2">両思い</option>
                <option value="3">片思い</option>
                <option value="4">叶わぬ恋</option>
                <option value="5">未練あり</option>
                <option value="6">気にぴあり</option>
                <option value="7">好きぴなし</option>
                <option value="8">失恋中</option>
                <option value="9">わからない</option>
                <option value="A">内緒</option>
            </select>
            <div style="height:3rem;"></div>
            <a onclick="getStartOmikuji()">おみくじを選ぶ</a>
        </div>

        <footer id="footer">
            <a class="toggle" onclick="toggleReNameBox()">タイトルを変更</a>
            <div style="background:#fff;padding:1em; border-style: solid; border-radius:1em; border-width:0.1em;" id="reName">
                <p>以下に新タイトルを入力して更新ボタンを押してください</p>
                <p>または好きなタイトルを押して更新ボタンを押してください</p>
                <button class="titleSe titleB" onclick="refreshTitleBox('おみくじ')">おみくじ</button>
                <br>
                <button class="titleSe titleB love" onclick="refreshTitleBox('恋みくじ')">恋みくじ</button> 
                <div class="flexBox">
                    <input class="titleCB" id="titleNameBox" type="text">
                    <button class="titleAB titleB" onclick="applyTitleName()">更新</button>
                </div>
                <a class="toggle" onclick="toggleReNameBox()">タイトルを変更 を非表示</a>
            </div>
            <br>
            <a class="toggle" onclick="toggleChangeLogsBox()">Change Logs</a>

                <h6>v1.1.0</h6>

                <a class="toggle" onclick="toggleChangeLogsBox()">Change Logsを非表示</a>
