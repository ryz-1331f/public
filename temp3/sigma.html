<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>シグマ計算</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="../assets/css/default.css">
    </head>
    <body id="beginPage">
        <header id="header">
            <h1>シグマを計算できるやつ</h1>
        </header>
        <div class="mainContents">
            <h3>これらは値を求めるためのものです</h3>
            <h3>以下に必要事項を入力して[計算]を押下してください</h3>
            <input id="topNum" type="text" placeholder="例) n" style="width:300px;height:30px;font-size:25px;">
            <br>
            <div style="display:flex;width:100px;height:50px;padding:1px;align-items: center;">
                <h1 style="font-size:35px;">Σ</h1>
                <input id="rigNum" type="text" placeholder="例) 3^(k-1)" style="width:300px;height:30px;font-size:25px;">
            </div>
            <div style="display:flex;">
                <input id="undNum" type="text" placeholder="例) k=1" value="k=1" style="width:300px;height:30px;font-size:25px;">
            </div>
            <br>
            <a style="width:300px;height:50px;font-size:20px;padding:10px;" onclick="startKeisan()">計算</a>
            <br>
            <input style="width:300px;height:50px;font-size:20px;" type="text" id="resultDisplay" placeholder="結果はここに表示されます">
        </div>
        <script src="./sigma.js"></script>
    </body>
</html>
