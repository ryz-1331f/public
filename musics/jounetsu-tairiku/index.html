<!DOCTYPE html>
<html lang="ja">
    <head>
        <title>情熱大陸 - TAB譜</title>
        <link rel="stylesheet" href="../../assets/css/telac-observing-log-base.css">
        <link rel="stylesheet" href="../../assets/css/home.css">
        <link rel="stylesheet" href="../../assets/css/base.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .tab {
                width: 100%;       /* 元の700px指定を100%（またはmax-width）に変更 */
                max-width: 700px;  /* 画面が広いときは最大700pxで止める */
                height: auto;      /* 縦横比を崩さずに縮小させる */
            }
            table, th, td {
                border-width: 1px;
                border-style: solid;
            }
            .topblock{
                background: #DDD;
            }
        </style>
    </head>
    <body>
        <div class="topblock block">
            <h1>情熱大陸 - TAB譜</h1>
        </div>
        <div class="mainblock block">
            <img class="tab" src="./jounetsu-tairiku-tab-note.png">
        </div>
        <div class="bottomblock block">
            <table>
                <tr>
                    <th>Credits</th>
                </tr>
                <tr>
                    <th>企画・監修</th>
                    <th>重松</th>
                </tr>
                <tr>
                    <th>MIDI化</th>
                    <th>龍三</th>
                </tr>
                <tr>
                    <th>MIDIのTAB譜化</th>
                    <th>衛藤よしひろ</th>
                </tr>
            </table>
        </div>
        <script>
            function downloadFromServer() {
                const a = document.createElement('a');
                a.href = "./jounetsu-tairiku-tab-note.png";
                a.download = "Tab-Note-001.png"; // 保存時のファイル名
  
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        </script>
    </body>
</html>
