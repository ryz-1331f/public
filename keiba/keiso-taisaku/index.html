<!DOCTYPE html>
<html lang="ja">
    <head>
        <title>競馬総合考査対策</title>
        <link rel="icon" href="../assets/img/taisaku-favicon.png">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
        <link rel="stylesheet" href="../../assets/css/default.css">
        <link rel="stylesheet" href="../../assets/css/hamburgerMenu.css">
        <link rel="stylesheet" href="./index.css">
        <script src="../accounts/users.js"></script>
        <script src="../assets/isLogined.js"></script>
    </head>
    <body>
        <header id="header">
            <h1>競馬総合 臨時考査対策</h1>
            <button class="openerBtn" id="menuToggleBtn" onclick="menuHideToggle()">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </header>
        <div class="menues" id="hamburgerMenues">
            <div>
                <h2>メニュー</h2>
                <button class="aMenuLink">競馬総合テスト対策</button>
                <br>
                <button class="aMenuLink" onclick="goToLink('../bakenGenerator/')">馬券ジェネレーター</button>  
            </div>
        </div>
        <div class="dialogParent">
            <div class="dialogs" id="dialog001">
                <div>
                    <div class="dialogTitle">
                        <h3>選択内容の確認</h3>
                        <a class="closeBTN" onclick="dialogCLS()">CLOSE</a>
                    </div>
                    <div class="dialogContents">
                        <div class="flexBox">
                            <p>Grade : </p>
                            <p id="chosenGrade"></p>
                        </div>
                        <div class="flexBox">
                            <p>Questions : </p>
                            <p id="chosenNOQ"></p>
                        </div>
                        <div class="flexBox">
                            <p>Order : </p>
                            <p id="chosenOOQ"></p>
                        </div>
                        <div class="flexBox">
                            <p>Difficulty : </p>
                            <p id="chosenDFC"></p>
                        </div>
                        <button class="selector" style="color:#fff; width:200px; background:linear-gradient(135deg,#f00,#ff0,#0f0,#0ff,#00f);" onclick="start()">START</button> 
                    </div>
                </div>
            </div>
        </div>
        <div class="mainContents">
            <h1 style="font-size:1.3rem;">競馬総合 臨時考査対策ページ</h1>
            <h3>目的の級にあった対策問題を解くことができます</h3>
            <p style="height:2px;"></p>
            <p>級選択</p>
            <button class="selector" style="width:200px;" id="gradeSW" onclick="selectGrade()">ここを押して級を指定</button>
            <p style="height:-2px;"></p>
            <p>問題数</p>
            <button class="selector" style="width:200px;" id="NOQSW" onclick="selectNOQ()">ここを押して問題数を指定</button>
            <p style="height:-2px;"></p>
            <p>出題順</p>
            <button class="selector" style="width:200px;" id="OOQSW" onclick="selectOOQ()">ここを押して出題順を指定</button>
            <p style="height:-2px;"></p>
            <p>難易度設定</p>
            <div class="flexBox">
                <button class="selector" style="width:96px;" id="DFCSW01" onclick="DFC01()">基礎</button>
                <button class="selector" style="width:96px;" id="DFCSW02" onclick="DFC02()">応用</button>
            </div>
            <button class="selector" style="width:200px;" id="DFCSWAll" onclick="DFCAll()">総括制御</button>
            <p style="height:-2px;"></p>
            <button class="selector" style="width:200px; background:#acf;" onclick="check()">確認画面へ</button>
            <p id="warningMessage"></p>
        </div>
        <script src="../../assets/js/hamburgerMenues.js"></script>
        <script src="../assets/bf.js"></script>
        <script src="./index.js"></script>
    </body>
</html>
